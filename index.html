<script>

function openPage(){

    const screen = document.getElementById("openScreen");

    /* OPEN SCREEN HIDE */
    screen.classList.add("hide");

    /* FLOWER RAIN */
    for(let i = 0; i < 80; i++){

        const flower = document.createElement("div");

        const flowers = [
            "🌸",
            "🌷",
            "🌺",
            "🌼",
            "💮",
            "🌹"
        ];

        flower.innerHTML =
            flowers[Math.floor(Math.random() * flowers.length)];

        flower.style.position = "fixed";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.top = "-50px";
        flower.style.fontSize =
            (18 + Math.random() * 28) + "px";

        flower.style.zIndex = "10000";
        flower.style.pointerEvents = "none";

        const duration =
            2.5 + Math.random() * 3;

        flower.style.animation =
            `flowerFall ${duration}s linear forwards`;

        document.body.appendChild(flower);

        setTimeout(() => {
            flower.remove();
        }, duration * 1000);
    }

    /* Extra second wave */
    setTimeout(() => {

        for(let i = 0; i < 35; i++){

            const flower = document.createElement("div");

            const flowers = [
                "🌸","🌷","🌺","🌼","🌹"
            ];

            flower.innerHTML =
                flowers[Math.floor(Math.random() * flowers.length)];

            flower.style.position = "fixed";
            flower.style.left = Math.random() * 100 + "vw";
            flower.style.top = "-40px";
            flower.style.fontSize =
                (18 + Math.random() * 25) + "px";

            flower.style.zIndex = "10000";
            flower.style.pointerEvents = "none";

            const duration =
                2 + Math.random() * 2.5;

            flower.style.animation =
                `flowerFall ${duration}s linear forwards`;

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);

        }

    }, 700);

}


/* FLOWER FALL ANIMATION */

const style = document.createElement("style");

style.innerHTML = `

@keyframes flowerFall{

    0%{
        transform:
            translateY(-50px)
            rotate(0deg)
            scale(.7);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(30px)
            rotate(180deg)
            scale(1);
    }

    100%{
        transform:
            translateY(110vh)
            translateX(-40px)
            rotate(420deg)
            scale(.8);

        opacity:.15;
    }
}

`;

document.head.appendChild(style);

</script>
